[project]
name = "weather-intel-experiments"
version = "0.1.0"
description = "Experimentation repo for AT2 - Weather Intelligence ML services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyterlab>=4.1",
    "openmeteo-requests>=1.2",
    "requests-cache>=1.2",
    "retry-requests>=2.0",
    "joblib>=1.3",
    "pytest>=8.0",
    # once you extend it, add your AT1 package here too, e.g.:
    # "your-at1-package>=0.2.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
